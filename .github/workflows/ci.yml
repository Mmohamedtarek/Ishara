name: CI

# Every push and pull request tests the whole repo; nothing here needs a device.
#   app       Flutter app: format, analyze, all host tests (pipeline, kit checksums, goldens,
#             widgets) with the coverage gate
#   android   debug APK (after app)
#   ai        AI kit: pytest, and the independent kit verifier against app/Ishara-Mobile-Kit
#   firmware  PlatformIO builds of every board, plus the Wokwi calibration test when the
#             WOKWI_CLI_TOKEN secret exists
# app, ai and firmware run in parallel. Firebase rules and emulator tests are added with the
# backend step. What to do when a job fails: app/README.md, "CI".
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/ishara_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies and generated code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Tests first, on the committed assets: kit_sync_test fails if they drifted from the kit.
      # Then a fresh sync must change nothing (no modified, deleted or new untracked files).
      - name: Kit assets match app/Ishara-Mobile-Kit (committed copy)
        run: |
          flutter test test/kit
          ../tools/sync_kit.sh
          test -z "$(git status --porcelain -- assets/packs/asl/kit pubspec.yaml)" || { git status --porcelain -- assets/packs/asl/kit; exit 1; }

      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyze (zero issues)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Tests with coverage
        run: flutter test --coverage

      - name: Learn days in Egypt's time zone (real daylight-saving switches)
        run: TZ=Africa/Cairo flutter test test/learn/domain/egypt_time_zone_test.dart

      - name: Coverage gate (>= 90 % on lib/core and domain layers)
        run: python3 ../tools/coverage_check.py coverage/lcov.info --min 90 lib/core 'lib/features/*/domain'

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/ishara_app/test/**/failures/
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-24.04
    needs: app
    defaults:
      run:
        working-directory: app/ishara_app
    steps:
      # The debug APK build (NDK, CMake, Gradle, every ABI) filled the runner's
      # disk after step 7a ("No space left on device" copying app-debug.apk).
      # Toolchains this job never uses are removed first; df shows the room.
      - name: Free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generated code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK (mock glove)
        run: flutter build apk --debug --dart-define=GLOVE=mock

      - name: Disk use after the build
        if: always()
        working-directory: .
        run: df -h /

  ai:
    name: AI (Python + kit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AI/Ishara-AI-v3-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AI/Ishara-AI-v3-2/requirements.txt

      - name: Dependencies
        run: pip install -r requirements.txt

      # data/ and ishara_rf.joblib are not in git; the tests don't need them.
      - name: Tests (pytest)
        run: python -m pytest tests -q

      # Exits 1 on any mismatch: every test vector, the BLE gap test and all mock files,
      # recomputed from the models with TensorFlow, independently of the app.
      - name: Verify the Mobile Kit (independent check)
        run: python tests/verify_kit.py ../../app/Ishara-Mobile-Kit

  firmware:
    name: Firmware (ESP32-S3)
    runs-on: ubuntu-24.04
    env:
      # Empty when the secret isn't set; the Wokwi steps check it.
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    defaults:
      run:
        working-directory: firmware/ishara-firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/ishara-firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build devkit, xiao and wokwi
        run: pio run -e devkit -e xiao -e wokwi | tee build.log

      - name: Flash and RAM use per build
        run: |
          {
            echo '### Firmware size'
            echo
            echo '```'
            grep -E '^Processing|^(RAM|Flash):' build.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wokwi calibration test (skipped, no token)
        if: env.WOKWI_CLI_TOKEN == ''
        run: >-
          echo "::notice title=Wokwi test skipped::The WOKWI_CLI_TOKEN secret is not set, so
          test/calibration.test.yaml did not run. Add the secret (repo Settings, Secrets and
          variables, Actions) to run it."

      # Runs the wokwi build on Wokwi's simulator (the firmware is uploaded to their service).
      - name: Wokwi calibration test (test/calibration.test.yaml)
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wokwi-cli" \
            https://github.com/wokwi/wokwi-cli/releases/download/v0.27.1/wokwi-cli-linuxstatic-x64
          chmod +x "$RUNNER_TEMP/wokwi-cli"
          "$RUNNER_TEMP/wokwi-cli" --timeout 60000 --scenario test/calibration.test.yaml .
