name: CI

# Every push and pull request: format, analyze, all host tests (pipeline, kit checksums,
# goldens, widgets) with the coverage gate, and an Android build. Nothing here needs a device.
# Firebase rules and emulator tests are added with the backend step.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/ishara_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies and generated code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Tests first, on the committed assets: kit_sync_test fails if they drifted from the kit.
      # Then a fresh sync must change nothing (no modified, deleted or new untracked files).
      - name: Kit assets match app/Ishara-Mobile-Kit (committed copy)
        run: |
          flutter test test/kit
          ../tools/sync_kit.sh
          test -z "$(git status --porcelain -- assets/kit pubspec.yaml)" || { git status --porcelain -- assets/kit; exit 1; }

      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyze (zero issues)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Tests with coverage
        run: flutter test --coverage

      - name: Coverage gate (>= 90 % on lib/core and domain layers)
        run: python3 ../tools/coverage_check.py coverage/lcov.info --min 90 lib/core 'lib/features/*/domain'

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/ishara_app/test/**/failures/
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-24.04
    needs: app
    defaults:
      run:
        working-directory: app/ishara_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generated code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK (mock glove)
        run: flutter build apk --debug --dart-define=GLOVE=mock
