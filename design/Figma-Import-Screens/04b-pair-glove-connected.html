<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Ishara - Pair glove - connected</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#15171C;background:#F4F2EC}
a{color:#3446C9;text-decoration:none}a:hover{color:#24309A}
button{font-family:inherit;cursor:pointer}
.rd{animation:rd 2.4s ease-out infinite}
.rd2{animation-delay:.8s}
.rd3{animation-delay:1.6s}
@keyframes rd{0%{transform:scale(.45);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head><body data-done="1" style="margin: 0px;">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F2EC; display: flex; flex-direction: column; padding: 20px 24px 28px; gap: 18px; font-family: 'Figtree', system-ui, sans-serif; color: #15171C">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Onboarding.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3E0D8; display: flex; align-items: center; justify-content: center; color: #15171C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; gap: 6px">
<span style="flex-grow: 1; height: 6px; border-radius: 3px; background: #3446C9"></span>
<span style="flex-grow: 1; height: 6px; border-radius: 3px; background: #3446C9"></span>
<span style="flex-grow: 1; height: 6px; border-radius: 3px; background: #D6D2C8"></span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.8px">Pair your glove</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #5B606B">Hold the button on the wrist strap for 3 seconds until the light blinks blue. Keep Bluetooth on.</p>
</div>
<div style="height: 250px; position: relative; display: flex; align-items: center; justify-content: center">

<div style="width: 120px; height: 120px; border-radius: 60px; background: #1F7A4D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; position: relative">


<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>

</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center">
<span style="font-size: 19px; font-weight: 700">Connected</span>
<span style="font-size: 14px; color: #5B606B">Ishara will reconnect by itself next time</span>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E0D8; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B606B">Battery</span><span style="font-size: 18px; font-weight: 700">82%</span></div>
<div style="padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E0D8; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B606B">Firmware</span><span style="font-size: 18px; font-weight: 700">v1.2.0</span></div>
</div>
