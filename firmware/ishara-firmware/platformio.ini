; Ishara Glove firmware - calibration + BLE stage
; Sensor pins live in include/config.h (identical on every board); board-specific bits
; (status LED, board name) live in include/board.h, chosen by BOARD_DEVKIT / BOARD_XIAO.
;
; Environments (all share the same source code and the same GPIOs):
;   devkit   ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM), Serial = UART port
;   xiao     Seeed XIAO ESP32-S3 (8 MB flash, 8 MB octal PSRAM), Serial = native USB CDC
;   wokwi    simulator (DevKitC): stream off at boot, "#" status line instead, no BLE
;            (Wokwi does not simulate the Bluetooth radio)
; `pio run` builds devkit only; `pio run -e xiao` / `pio run -e wokwi` build the others.

[platformio]
default_envs = devkit

[esp32s3]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Warnings for our own code only (the Arduino core is not built with these).
build_src_flags =
    -Wall
    -Wextra
; BLE (docs/BLE-CONTRACT.md): NimBLE peripheral only, one central at a time.
lib_deps =
    h2zero/NimBLE-Arduino@~1.4.3
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

[env:devkit]
extends = esp32s3
board = esp32-s3-devkitc-1
; N16R8: 16 MB quad flash + 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Serial = UART0 (the "UART" USB port on the DevKitC).
build_flags =
    ${esp32s3.build_flags}
    -DBOARD_DEVKIT
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSTREAM_ON_BOOT=1
    -DSIM_MODE=0

[env:xiao]
extends = esp32s3
board = seeed_xiao_esp32s3
; 8 MB flash + 8 MB octal PSRAM (the board file already sets qio_opi and BOARD_HAS_PSRAM).
; default_8MB.csv: two 3.3 MB app slots, same NVS offset/size as default_16MB.csv.
board_build.partitions = default_8MB.csv
; Serial = native USB CDC (the XIAO has no USB-UART chip; enumerates as 303A:1001).
build_flags =
    ${esp32s3.build_flags}
    -DBOARD_XIAO
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSTREAM_ON_BOOT=1
    -DSIM_MODE=0

[env:wokwi]
extends = esp32s3
; Wokwi simulates the plain DevKitC (no PSRAM), so keep the board defaults here.
board = esp32-s3-devkitc-1
build_flags =
    ${esp32s3.build_flags}
    -DBOARD_DEVKIT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSTREAM_ON_BOOT=0
    -DSIM_MODE=1
    -DBLE_ENABLED=0
